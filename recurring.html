<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS Solutions – Recurring Service</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:   #111111;
    --gold:    #C9A84C;
    --gold-lt: #E2C97E;
    --gold-dk: #8C6F2A;
    --white:   #FFFFFF;
    --off:     #F7F6F3;
    --gray:    #6B6B6B;
    --border:  #E0D9CC;
    --green:   #2E7D4F;
    --red:     #c0392b;
  }

  body { font-family: 'Inter', sans-serif; background: var(--white); color: var(--black); min-height: 100vh; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 48px; min-height: 72px;
    border-bottom: 1px solid var(--border);
    background: var(--white); position: sticky; top: 0; z-index: 100;
    background-image: url('/api/site-image?name=NavBackground.jpg');
    background-size: cover; background-position: center;
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-diamond { width: 80px; height: 80px; }
  .nav-right { display: flex; align-items: center; gap: 24px; }
  .nav-link { font-size: 13px; color: var(--gray); text-decoration: none; letter-spacing: .04em; transition: color .2s; }
  .nav-link:hover { color: var(--gold); }

  .portal-header {
    background: var(--off); border-bottom: 1px solid var(--border);
    padding: 16px 48px; display: flex; align-items: center; justify-content: space-between;
  }
  .portal-header p { font-size: 12px; color: var(--gray); }
  .portal-header strong { color: var(--black); }
  .btn-signout { font-size: 11px; color: var(--gray); background: none; border: none; cursor: pointer; letter-spacing: .06em; text-decoration: underline; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 48px; background: var(--white); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { padding: 16px 20px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s, border-color .2s; text-decoration: none; display: inline-block; flex-shrink: 0; white-space: nowrap; }
  .tab.active { color: var(--black); border-bottom-color: var(--gold); }

  .wrap { padding: 32px 48px 60px; }
  .wrap h1 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .wrap .list-sub { font-size: 12px; color: var(--gray); margin-bottom: 24px; line-height: 1.6; }
  .empty-note { color: var(--gray); font-size: 14px; padding: 40px 0; text-align: center; }

  .order-card { border: 1px solid var(--border); margin-bottom: 14px; background: var(--white); }
  .order-card-header { padding: 16px 20px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .order-card-header:hover { background: var(--off); }
  .order-num { font-size: 14px; font-weight: 700; font-family: 'Cormorant Garamond', serif; }
  .order-date { font-size: 11px; color: var(--gray); margin-top: 3px; }
  .status-pill { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 12px; font-weight: 600; border-radius: 3px; background: #E6F4FB; color: #1F6E96; white-space: nowrap; flex-shrink: 0; }
  .order-card-body { padding: 20px; display: none; }
  .order-card-body.open { display: block; }

  /* order-2col: mismo mecanismo de 2->3 columnas que ya usa Orders en
     Processing/History (#panel-processing/#panel-history .order-2col)
     -- aqui sin el prefijo porque recurring.html es su propia pagina,
     no un panel interno. */
  .order-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin: 4px 0 0; }
  .order-2col.open { grid-template-columns: 1fr 1fr 1fr; }
  .col-right { display: none; min-width: 0; padding: 18px; background: var(--off); }
  .order-2col.open .col-right { display: block; border-left: 1px solid var(--border); }
  @media (max-width: 700px) {
    .order-2col, .order-2col.open { grid-template-columns: 1fr; }
    .order-2col.open .col-right { border-left: none; border-top: 1px solid var(--border); }
  }
  .detail-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); margin-bottom: 10px; }
  .field-caption { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .field-value { font-size: 14px; color: var(--black); }

  /* Fila de servicio con nota + camara -- copiado exacto de admin.html
     (buildAdminSelectedListHtml, ver Active > Edit), reusado aqui para
     "Currently on this contract" dentro del panel de Request a Change.
     La nota y la foto de estas filas NO se ligan a un servicio
     especifico en el backend (confirmado con el dueno) -- la nota se
     junta al mensaje general, la camara reusa addClientPhoto() tal
     cual. */
  .svc-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .svc-row:last-child { border-bottom: none; }
  .svc-row-name { flex: 0 0 auto; max-width: 240px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .svc-row-notewrap { flex: 1; min-width: 0; }
  .svc-row-note { width: 100%; border: 1.5px solid var(--border); border-radius: 5px; padding: 7px 10px;
    font-size: 12.5px; font-family: inherit; color: var(--black); background: var(--off); outline: none;
    box-sizing: border-box; transition: border-color .15s, background .15s; }
  .svc-row-note:focus { border-color: var(--gold); background: var(--white); }
  .svc-row-note::placeholder { color: #A9A49A; }
  .svc-row-cam { flex-shrink: 0; width: 32px; height: 32px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--gray); cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: border-color .15s, color .15s; position: relative; }
  .svc-row-cam:hover { border-color: var(--gold); color: var(--gold-dk); }
  .svc-row-cam svg { width: 14px; height: 14px; }
  /* Dentro de col-right (1/3 de columna, tan angosto como un celular),
     se apila igual que ya hace admin.html en su propio breakpoint
     movil -- en vez de inventar una proporcion de columnas nueva. */
  .col-right .svc-row { flex-wrap: wrap; }
  .col-right .svc-row-name { max-width: none; flex-basis: 100%; white-space: normal; }

  /* Diff de servicios agregados/quitados -- mismo patron ya usado por
     Supervisor (tech.gsocd.com) en su propio "Update Services". */
  .diff-box { background: var(--white); border: 1px solid var(--border); padding: 12px 14px; margin: 14px 0; border-radius: 4px; }
  .diff-line { font-size: 12px; margin-bottom: 4px; }
  .diff-line.removed { color: var(--red); }
  .diff-line.added { color: var(--green); }
  .diff-empty { font-size: 12px; color: var(--gray); }
  .um-note-box { background: var(--off); border: 1px solid var(--border); padding: 12px; margin: 6px 0 10px; }
  .um-note-box label { font-size: 10px; text-transform: uppercase; color: var(--gray); font-weight: 700; display: block; margin-bottom: 6px; }
  .um-note-box textarea { width: 100%; padding: 10px; border: 1px solid var(--border); font-size: 12px; font-family: inherit; resize: vertical; min-height: 56px; box-sizing: border-box; }
  .um-note-error { font-size: 11px; color: var(--red); margin-top: 6px; display: none; }
  .um-note-error.show { display: block; }

  .hist-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .hist-head-main { flex: 1; min-width: 0; line-height: 1.6; }
  .hist-toggle { font-size: 10px; color: var(--gold); white-space: nowrap; flex-shrink: 0; }
  .hist-detail { display: none; margin-top: 10px; padding: 12px 14px; background: var(--off); border-radius: 4px; border-left: 3px solid var(--gold); }
  .hist-detail.open { display: block; }
  .hist-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; padding: 10px 14px; margin-bottom: 20px; }
  .hist-box .hist-detail { margin: 10px -14px -10px; border-radius: 0; border-left: none; }

  .svc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .svc-table td { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .svc-table tr:last-child td { border-bottom: none; }
  .svc-table td.lvl { color: var(--gold-dk); font-weight: 600; text-align: right; }

  .btn { padding: 10px 18px; border-radius: 3px; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .03em; cursor: pointer; border: none; }
  .btn-gold { background: var(--gold); color: var(--white); }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--black); }
  .btn-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

  .client-photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .client-photo-thumb { width: 52px; height: 52px; border-radius: 3px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; background: var(--off); }
  .gallery-link { font-size: 12px; color: var(--gold-dk); text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 10px; }

  /* .change-box/.change-sent (cuadro viejo debajo del boton) se
     quitaron -- reemplazados por el panel de 3a columna arriba. */

  .gallery-view { display: none; padding: 32px 48px 60px; }
  .gallery-view.active { display: block; }
  .gallery-back { font-size: 12px; color: var(--gold-dk); cursor: pointer; margin-bottom: 14px; display: inline-block; }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
  .main-view.hidden { display: none; }

  .toast {
    position: fixed; bottom: 32px; right: 32px; z-index: 300;
    background: var(--black); color: var(--white); padding: 18px 24px;
    border-left: 3px solid var(--gold); max-width: 380px;
    font-size: 13px; line-height: 1.6; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    display: none; animation: toastIn .35s cubic-bezier(.22,.9,.28,1) both;
  }
  .toast.show { display: block; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  @media (max-width: 768px) {
    nav { padding: 12px 20px; }
    .portal-header { padding: 14px 20px; }
    .tabs { padding: 0 20px; }
    .wrap, .gallery-view { padding: 24px 20px 60px; }
  }
</style>
</head>
<body>

<input type="file" id="client-camera-input" accept="image/*" capture="environment" style="display:none">

<nav>
  <div class="logo-wrap">
    <img src="" alt="GS Solutions Inc." class="logo-diamond" style="object-fit:contain">
  </div>
  <div class="nav-right">
    <a href="https://gsocd.com" class="nav-link">Home</a>
    <a href="services.html" class="nav-link">Services</a>
  </div>
</nav>

<div id="gsNav"></div>

<div class="portal-header">
  <p>Welcome back, <strong id="client-name">Client</strong></p>
  <button class="btn-signout" onclick="doSignout()">Sign out</button>
</div>

<div class="main-view" id="main-view">
  <div class="wrap">
    <h1>Recurring Service</h1>
    <p class="list-sub">Your standing cleaning contract(s) and visit history.</p>
    <div id="contracts-list"><p class="empty-note">Loading…</p></div>
  </div>
</div>

<div class="gallery-view" id="gallery-view">
  <span class="gallery-back" onclick="closeGallery()">&larr; Back</span>
  <p class="detail-label">Gallery — all visits</p>
  <div class="gallery-grid" id="gallery-grid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@v1.20.4/nav-premium/nav-premium.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@v1.0.0/lightbox/lightbox.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@v1.6.0/order-history/order-history.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@v1.25.24/order-form-premium/order-form-premium.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tunena1023/gsocd-shared@v1.26.0/service-picker/service-picker.js"></script>

<script>
const client = GS.requireSession();
if (client) {

  GSOrderFormPremium.styleTag();
  GS.applyLogo();
  GSNavPremium.init('gsNav', [
    { label: 'New Order', href: 'customer.html' },
    { label: 'Templates', href: 'templates.html' },
    { label: 'Processing', href: 'tracking.html#processing' },
    { label: 'History', href: 'tracking.html#history' },
    { label: 'Gallery', href: 'gallery.html' },
    { label: 'Recurring', href: 'recurring.html', active: true },
    { label: 'Profile', href: 'profile.html' }
  ]);
  document.getElementById('client-name').textContent = client.businessName || client.clientId || 'Client';

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  function $(id) { return document.getElementById(id); }

  /* Mismas 2 funciones exactas que ya usa tracking.html -- no existe
     GS.signOut ni GS.showToast, cada pagina las define localmente. */
  function doSignout() {
    GS.session.clear();
    location.href = 'index.html';
  }
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 6000);
  }

  let contracts = [];
  let openId = null;
  let clientPhotoTarget = null; // recurringServiceId de la tarjeta donde se esta agregando foto

  async function loadRecurring() {
    const box = document.getElementById('contracts-list');
    try {
      const data = await GS.api('/get-my-recurring', { body: { clientId: client.clientId } });
      contracts = data.contracts || [];
      renderContracts();
    } catch (e) {
      box.innerHTML = '<p class="empty-note">Could not load: ' + esc(e.message) + '</p>';
    }
  }

  function toggleCard(id) {
    openId = (openId === id) ? null : id;
    /* renderContracts() reconstruye TODO el HTML de nuevo -- cualquier
       referencia viva a un panel de Request a Change abierto quedaria
       apuntando a DOM que ya no existe. */
    rcChangeOpenFor = null;
    rcChangePicker = null;
    renderContracts();
  }

  function renderContracts() {
    const box = document.getElementById('contracts-list');
    if (!contracts.length) { box.innerHTML = '<p class="empty-note">No recurring service on file right now.</p>'; return; }

    box.innerHTML = contracts.map(c => {
      const isOpen = openId === c.id;
      const svcRows = (c.Services || []).map(s =>
        '<tr><td>' + esc(s.ServiceName) + '</td><td class="lvl">' + (s.Level ? esc(s.Level) : '—') + '</td></tr>').join('');
      const historyHtml = GSOrderHistory.html('RC-' + c.id, c.history || [], { mode: 'client' });
      const clientPhotosHtml = (c.clientPhotos || []).map(p =>
        '<img class="client-photo-thumb" src="' + esc(p.downloadUrl) + '" onclick="window.open(\'' + esc(p.downloadUrl) + '\',\'_blank\')">').join('');

      let bodyHtml = '';
      if (isOpen) {
        bodyHtml = '<div class="order-card-body open">' +
          '<div class="order-2col" id="ord2col-' + c.id + '">' +
            '<div>' +
              '<p class="detail-label">Contract Details</p>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:18px">' +
                '<div><div class="field-caption">Days</div><div class="field-value">' + esc(c.daysOfWeek) + '</div></div>' +
                '<div><div class="field-caption">Time</div><div class="field-value">' + esc(c.time) + '</div></div>' +
                '<div><div class="field-caption">Building</div><div class="field-value">' + (c.buildingNumber ? esc(c.buildingNumber) : '—') + '</div></div>' +
                '<div><div class="field-caption">Active Since</div><div class="field-value">' + esc(c.activeSince) + '</div></div>' +
              '</div>' +
              '<div class="hist-box">' +
                '<div class="hist-head" onclick="toggleSvc(\'' + c.id + '\')">' +
                  '<div class="hist-head-main"><p class="detail-label" style="margin:0">Services</p></div>' +
                  '<span class="hist-toggle">▾ ' + (c.Services || []).length + ' services</span>' +
                '</div>' +
                '<div class="hist-detail" id="svc-detail-' + c.id + '"><table class="svc-table">' + svcRows + '</table></div>' +
              '</div>' +
              '<p class="detail-label">Your Photos</p>' +
              '<div class="client-photo-thumbs">' + clientPhotosHtml + '</div>' +
              '<button class="gs-ofp-btn-secondary" onclick="addClientPhoto(\'' + c.id + '\')">+ Add Photo</button><br>' +
              '<span class="gallery-link" onclick="openGallery(\'' + c.id + '\')">📷 View Gallery (photos from staff)</span>' +
              '<div class="btn-actions"><button class="gs-ofp-btn-secondary" id="rc-change-btn-' + c.id + '" onclick="rcToggleChangePanel(\'' + c.id + '\')">Request a Change</button></div>' +
            '</div>' +
            '<div><p class="detail-label">History</p>' + historyHtml + '</div>' +
            '<div class="col-right" id="sidepanel-' + c.id + '"></div>' +
          '</div>' +
        '</div>';
      }

      return '<div class="order-card">' +
        '<div class="order-card-header" onclick="toggleCard(\'' + c.id + '\')">' +
          '<div><div class="order-num">' + esc(c.division || 'Janitorial') + (c.buildingNumber ? ' — Bldg ' + esc(c.buildingNumber) : '') + '</div>' +
          '<div class="order-date">' + esc(c.daysOfWeek) + ' · ' + esc(c.time) + '</div></div>' +
          '<span class="status-pill">ACTIVE</span>' +
        '</div>' +
        bodyHtml +
      '</div>';
    }).join('');
  }

  function toggleSvc(id) {
    const el = document.getElementById('svc-detail-' + id);
    if (el) el.classList.toggle('open');
  }

  /* ===== Galeria -- navega DENTRO de la pagina (nunca pestana
     nueva, nunca modal), mismo criterio confirmado con el usuario. ===== */
  async function openGallery(id) {
    document.getElementById('main-view').classList.add('hidden');
    document.getElementById('gallery-view').classList.add('active');
    const grid = document.getElementById('gallery-grid');
    grid.innerHTML = '<p class="empty-note">Loading…</p>';
    try {
      const data = await GS.api('/get-recurring-gallery', { body: { recurringServiceId: id } });
      const photos = data.photos || [];
      grid.innerHTML = photos.length
        ? photos.map(p => '<img src="' + esc(p.downloadUrl) + '" onclick="window.open(\'' + esc(p.downloadUrl) + '\',\'_blank\')">').join('')
        : '<p class="empty-note">No photos yet.</p>';
    } catch (e) {
      grid.innerHTML = '<p class="empty-note">Could not load: ' + esc(e.message) + '</p>';
    }
  }
  function closeGallery() {
    document.getElementById('gallery-view').classList.remove('active');
    document.getElementById('main-view').classList.remove('hidden');
  }

  /* ===== Fotos del cliente -- mismo <input> nativo que ya usa el
     resto del portal, sin ubicacion (esto no rastrea a nadie). ===== */
  function addClientPhoto(id) {
    clientPhotoTarget = id;
    document.getElementById('client-camera-input').click();
  }
  document.getElementById('client-camera-input').addEventListener('change', async function () {
    const file = this.files[0];
    const id = clientPhotoTarget;
    this.value = '';
    clientPhotoTarget = null;
    if (!file || !id) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await GS.api('/upload-client-recurring-photo', { body: { recurringServiceId: id, imageBase64: reader.result } });
        showToast('Photo saved.');
        await loadRecurring();
        openId = id;
        renderContracts();
      } catch (e) {
        alert('Could not save that: ' + e.message);
      }
    };
    reader.readAsDataURL(file);
  });

  /* ===== Request a Change -- panel de 3a columna a la derecha, mismo
     mecanismo de 2->3 columnas que ya usa Orders en Processing/History
     (order-2col/col-right), con el selector real de servicios + diff
     ya usado por Supervisor (tech.gsocd.com) para "Update Services".
     Se manda igual que una sugerencia de supervisor (mismo mecanismo,
     Pending Review), cae en el mismo Review que ya usa la oficina.
     Solo un panel abierto a la vez -- abrir uno nuevo cierra
     cualquier otro que estuviera abierto. ===== */
  let rcChangeOpenFor = null;
  let rcChangePicker = null;
  let rcChangeBaseNames = [];
  let servicesCatalogCache = null;

  function rcToggleChangePanel(id) {
    const wrap = document.getElementById('ord2col-' + id);
    const btn = document.getElementById('rc-change-btn-' + id);
    if (!wrap) return;

    if (rcChangeOpenFor === id) {
      wrap.classList.remove('open');
      const slot = document.getElementById('sidepanel-' + id);
      if (slot) slot.innerHTML = '';
      if (btn) btn.textContent = 'Request a Change';
      rcChangeOpenFor = null;
      rcChangePicker = null;
      return;
    }
    if (rcChangeOpenFor) {
      const prevWrap = document.getElementById('ord2col-' + rcChangeOpenFor);
      const prevBtn = document.getElementById('rc-change-btn-' + rcChangeOpenFor);
      const prevSlot = document.getElementById('sidepanel-' + rcChangeOpenFor);
      if (prevWrap) prevWrap.classList.remove('open');
      if (prevSlot) prevSlot.innerHTML = '';
      if (prevBtn) prevBtn.textContent = 'Request a Change';
    }

    rcChangeOpenFor = id;
    if (btn) btn.textContent = 'Cancel';
    wrap.classList.add('open');
    rcRenderChangePanel(id);
  }

  function rcRenderChangePanel(id) {
    const slot = document.getElementById('sidepanel-' + id);
    if (!slot) return;
    const c = contracts.find(x => x.id === id);
    if (!c) return;

    /* "Currently on this contract" -- mismo look que
       buildAdminSelectedListHtml() en admin.html (Active > Edit), pero
       la nota y la foto de estas filas NO se ligan a un servicio
       especifico en el backend (confirmado con el dueno) -- la nota
       se junta al mensaje general de la solicitud, y la camara reusa
       addClientPhoto() tal cual (misma carpeta de fotos del contrato). */
    const currentRowsHtml = (c.Services || []).map((s, i) => {
      const label = esc(s.ServiceName) + (s.Level ? ' — ' + esc(s.Level) : '');
      return '<div class="svc-row">' +
        '<b class="svc-row-name">' + label + '</b>' +
        '<div class="svc-row-notewrap"><input type="text" id="rc-svc-note-' + id + '-' + i + '" class="svc-row-note" placeholder="Note about this service (optional)"></div>' +
        '<button type="button" class="svc-row-cam" title="Add a photo" onclick="addClientPhoto(\'' + id + '\')">' + CAM_ICON + '</button>' +
      '</div>';
    }).join('');

    slot.innerHTML =
      '<p class="detail-label" style="margin-bottom:4px">Request a Change</p>' +
      '<p style="font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.6">Add or remove services below. Our office reviews every request before it takes effect.</p>' +
      (currentRowsHtml ? '<p class="field-caption" style="margin-bottom:6px">Currently on this contract</p><div style="margin-bottom:16px">' + currentRowsHtml + '</div>' : '') +
      '<div id="rc-picker-mount-' + id + '"></div>' +
      '<div id="rc-diff-mount-' + id + '"></div>' +
      '<div style="margin-top:14px">' +
        '<textarea id="rc-general-note-' + id + '" placeholder="Anything else we should know? (optional)" style="width:100%;min-height:56px;padding:10px;border:1.5px solid var(--border);border-radius:5px;font-family:inherit;font-size:12.5px;box-sizing:border-box;resize:vertical"></textarea>' +
      '</div>' +
      '<div class="btn-actions" style="margin-top:14px">' +
        '<button class="gs-ofp-btn-primary" onclick="rcSendChangeRequest(\'' + id + '\')">Send to Office</button>' +
        '<button class="gs-ofp-btn-secondary" onclick="rcToggleChangePanel(\'' + id + '\')">Cancel</button>' +
      '</div>';

    rcMountChangePicker(id, c);
  }

  async function rcMountChangePicker(id, c) {
    if (!servicesCatalogCache) {
      try {
        const data = await GS.api('/get-services', { method: 'GET' });
        servicesCatalogCache = data.catalog || [];
      } catch (e) {
        servicesCatalogCache = [];
      }
    }
    /* Puede que el cliente ya haya cerrado este panel (o abierto otro)
       mientras el catalogo cargaba -- no montar sobre un mount-point
       que ya no existe. */
    const mountEl = document.getElementById('rc-picker-mount-' + id);
    if (!mountEl || rcChangeOpenFor !== id) return;

    const initialSelected = { Commercial: {} };
    const initialLevels = {};
    rcChangeBaseNames = [];
    (c.Services || []).forEach(s => {
      initialSelected.Commercial[s.ServiceName] = s.ServiceName; // sin sku real disponible aqui, se usa el nombre como llave
      if (s.Level) initialLevels['Commercial|' + s.ServiceName] = s.Level;
      rcChangeBaseNames.push(s.ServiceName);
    });
    rcChangePicker = GSServicePicker.mount('rc-change-' + id, mountEl, {
      catalog: servicesCatalogCache,
      division: 'Janitorial', mode: 'levels', showSelectAll: false,
      groupByCategory: true, propertyType: 'Commercial',
      initialSelected: initialSelected, initialLevels: initialLevels,
      onChange: function () { rcRenderChangeDiff(id); }
    });
    rcRenderChangeDiff(id);
  }

  function rcRenderChangeDiff(id) {
    const slot = document.getElementById('rc-diff-mount-' + id);
    if (!slot || !rcChangePicker) return;
    const selected = rcChangePicker.getSelected();
    const nowNames = new Set();
    Object.values(selected).forEach(m => Object.keys(m).forEach(n => nowNames.add(n)));
    const base = new Set(rcChangeBaseNames);
    const removed = [...base].filter(n => !nowNames.has(n));
    const added = [...nowNames].filter(n => !base.has(n));

    if (!removed.length && !added.length) {
      slot.innerHTML = '<div class="diff-box"><span class="diff-empty">No changes yet.</span></div>';
      return;
    }
    let html = '<div class="diff-box">';
    added.forEach(n => html += '<div class="diff-line added">+ ' + esc(n) + '</div>');
    removed.forEach((n, i) => {
      html += '<div class="diff-line removed">− ' + esc(n) + '</div>';
      html += '<div class="um-note-box">' +
        '<label>Why remove "' + esc(n) + '"? (required)</label>' +
        '<textarea id="rc-diffnote-' + id + '-' + i + '"></textarea>' +
        '<p class="um-note-error" id="rc-diffnote-error-' + id + '-' + i + '">Please add a note.</p>' +
      '</div>';
    });
    html += '</div>';
    slot.innerHTML = html;
  }

  /* FIX REAL encontrado al probar: una "async function" declarada
     dentro de un bloque if{} NO se eleva (hoist) al scope global igual
     que una function normal -- confirmado con una prueba aislada
     (normalFn queda en window, asyncFn no). Como este onclick inline
     necesita encontrarla en window, se asigna explicito en vez de
     depender del hoisting. Mismo bug real ya existia en la version
     vieja de esta funcion (senalado aparte, no es nuevo de este
     cambio). */
  window.rcSendChangeRequest = async function (id) {
    if (!rcChangePicker) return;
    const c = contracts.find(x => x.id === id);
    if (!c) return;
    const selected = rcChangePicker.getSelected();
    const levels = rcChangePicker.getLevels();
    const nowNames = new Set();
    Object.values(selected).forEach(m => Object.keys(m).forEach(n => nowNames.add(n)));
    const base = new Set(rcChangeBaseNames);
    const addedNames = [...nowNames].filter(n => !base.has(n));
    const removedList = [...base].filter(n => !nowNames.has(n));

    const removedNotes = [];
    let ok = true;
    removedList.forEach((n, i) => {
      const input = document.getElementById('rc-diffnote-' + id + '-' + i);
      if (!input || !input.value.trim()) {
        const errEl = document.getElementById('rc-diffnote-error-' + id + '-' + i);
        if (errEl) errEl.classList.add('show');
        ok = false;
        return;
      }
      removedNotes.push({ serviceName: n, note: input.value.trim() });
    });
    if (!ok) return;

    /* Las notas por servicio (de los que YA tiene el contrato) se
       juntan al mensaje general -- no van ligadas a un servicio
       especifico en el backend (confirmado con el dueno). */
    const messageParts = [];
    (c.Services || []).forEach((s, i) => {
      const noteInput = document.getElementById('rc-svc-note-' + id + '-' + i);
      if (noteInput && noteInput.value.trim()) {
        messageParts.push(s.ServiceName + ': ' + noteInput.value.trim());
      }
    });
    const generalInput = document.getElementById('rc-general-note-' + id);
    if (generalInput && generalInput.value.trim()) messageParts.push(generalInput.value.trim());
    const message = messageParts.join('\n');

    if (!addedNames.length && !removedNotes.length && !message) { showToast('Nothing was changed.'); return; }

    try {
      await GS.api('/request-recurring-change', {
        body: {
          recurringServiceId: id, clientId: client.clientId,
          services: addedNames.map(n => ({ serviceName: n, level: levels['Commercial|' + n] || '' })),
          removedNotes: removedNotes,
          message: message
        }
      });
      rcToggleChangePanel(id);
      showToast('Sent to the office for review.');
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  loadRecurring();
} else {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
